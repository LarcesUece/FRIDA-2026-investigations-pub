[project]
name = "back-end"
version = "0.1.0"
description = "Back-End"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.13.0",
    "asyncpg>=0.31.0",
    "polars>=1.39.3",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
